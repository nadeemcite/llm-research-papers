description = "100 LLM Era Papers. Landmark LLM-era papers reimplemented from scratch in PyTorch."
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "gspread>=6.2.1",
    "jupyter>=1.1.1",
    "kaggle>=2.2.4",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pymupdf>=2.0",
    "torch",
    "transformers>=5.21.0",
]
